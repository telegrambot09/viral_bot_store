    <meta charset="UTF-8">

    <style>
        :root { 
            --primary: #581c87; 
            --accent: linear-gradient(135deg, #6d28d9, #4f46e5); 
            --bg: #020617; 
            --card-bg: #0f172a; 
            --white: #ffffff; 
            --text-main: #f8fafc; 
            --text-dim: #94a3b8; 
            --input-bg: #1e293b;
            --play-btn: linear-gradient(135deg, #22c55e, #15803d);
            --download-btn: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-main); font-family: sans-serif; }

        .sticky-top-container { position: sticky; top: 0; z-index: 1000; background: var(--bg); border-bottom: 2px solid var(--primary); }
        .banner-header { width: 100%; height: auto; display: block; }
        
        .social-bar { background: rgba(30, 41, 59, 0.5); margin: 10px 15px 5px 15px; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(88, 28, 135, 0.3); }
        .social-icons { display: flex; gap: 25px; }
        .social-icons a { color: var(--white); font-size: 20px; text-decoration: none; }

        .search-container { padding: 10px 15px; max-width: 600px; margin: 0 auto; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--primary); background: var(--input-bg); color: white; outline: none; }

        .content-section { display: none; padding: 15px; padding-bottom: 120px; max-width: 600px; margin: 0 auto; }
        .content-section.active { display: block; }

        /* Grids */
        #video-list, #short-film-list, #image-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: start;
        }

        .v-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; margin-bottom: 10px; border: 1px solid #1e293b; transition: 0.4s; }
        
        .v-thumb { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden; }
        .shorts-card .v-thumb { aspect-ratio: 9/16; }
        .image-card .v-thumb { aspect-ratio: auto; }
        
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .image-card .v-thumb img { object-fit: contain; background: #000; }

        .badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: white; padding: 4px 8px; border-radius: 6px; font-size: 9px; z-index: 5; }
        
        .bn-text { font-size: 14px; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; }
        
        .btn-main { width: 100%; padding: 10px; border: none; border-radius: 10px; background: var(--accent); color: white; font-weight: 700; cursor: pointer; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; }
        .btn-main.ready { background: var(--play-btn); }
        .btn-main.download { background: var(--download-btn); }
        
        .btn-share { width: 100%; padding: 8px; border: 1px dashed #6d28d9; border-radius: 8px; background: rgba(109, 40, 217, 0.1); color: #a78bfa; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }

        .nav-wrapper { position: fixed; bottom: 20px; left: 5%; right: 5%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid var(--primary); z-index: 1000; }
        .bottom-nav { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); cursor: pointer; font-size: 11px; }
        .nav-item.active { color: #a78bfa; }

        /* Hide logic */
        .hide-header .banner-header, .hide-header .social-bar { display: none; }
    </style>
</head>
<body id="main-body">

    <div class="sticky-top-container" id="header-container">
        <img src="https://i.postimg.cc/FswJ4vdD/IMG-20260107-051613.jpg" alt="Banner" class="banner-header">
        <div class="social-bar">
            <span>Community</span>
            <div class="social-icons">
                <a id="fb-link" href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a id="tg-link" href="#" target="_blank"><i class="fab fa-telegram-plane"></i></a>
                <a id="wa-link" href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
        <div class="search-container">
            <div class="search-box"><input type="text" id="searchInput" placeholder="সার্চ করুন..." oninput="searchContent()"></div>
        </div>
    </div>

    <section id="video" class="content-section active"><div id="video-list"></div></section>
    <section id="image" class="content-section"><div id="image-list"></div></section>
    <section id="short-film" class="content-section"><div id="short-film-list"></div></section>

    <div class="nav-wrapper">
        <nav class="bottom-nav">
            <div class="nav-item active" data-cat="video" onclick="tab('video', this)"><i class="fa-solid fa-bolt"></i><span>Video</span></div>
            <div class="nav-item" data-cat="image" onclick="tab('image', this)"><i class="fa-solid fa-images"></i><span>Image</span></div>
            <div class="nav-item" data-cat="short-film" onclick="tab('short-film', this)"><i class="fa-solid fa-clapperboard"></i><span>Shorts</span></div>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyByCC_vYgY_vA92s6OHDbKhbkTqnycYb5Q",
            authDomain: "stream-vibe-b4900.firebaseapp.com",
            databaseURL: "https://stream-vibe-b4900-default-rtdb.firebaseio.com",
            projectId: "stream-vibe-b4900",
            storageBucket: "stream-vibe-b4900.firebasestorage.app",
            messagingSenderId: "997470087286",
            appId: "1:997470087286:web:3ba3facca244c2c6651757"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('socialLinks').on('value', snap => {
            const l = snap.val();
            if(l){
                document.getElementById('fb-link').href = l.fb || "#";
                document.getElementById('tg-link').href = l.tg || "#";
                document.getElementById('wa-link').href = l.wa || "#";
            }
        });

        function tab(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
            
            const body = document.getElementById('main-body');
            if(id === 'image' || id === 'short-film') {
                body.classList.add('hide-header');
            } else {
                body.classList.remove('hide-header');
            }
            loadData(id);
        }

        function loadData(category) {
            db.ref('contents').orderByChild('category').equalTo(category).on('value', snapshot => {
                const list = document.getElementById(`${category}-list`);
                let items = [];
                snapshot.forEach(child => { items.push({ id: child.key, ...child.val() }); });
                renderUI(items.reverse(), list, category);
            });
        }

        function renderUI(data, container, category) {
            let html = '';
            data.forEach(item => {
                const id = item.id;
                let cardClass = "v-card";
                if(category === 'short-film') cardClass += " shorts-card";
                if(category === 'image') cardClass += " image-card";
                
                let btnText = "";
                let btnClass = "btn-main";
                
                if(category === 'image') {
                    btnText = "Download";
                    btnClass = "btn-main download";
                } else {
                    let storedClicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;
                    let isReady = storedClicks >= item.adsCount;
                    btnText = isReady ? "Play Video" : `Unlock ${item.adsCount - storedClicks} Ads`;
                    btnClass = isReady ? "btn-main ready" : "btn-main";
                }

                html += `
                <div class="${cardClass}" id="card-${id}" data-title="${item.title.toLowerCase()}">
                    <div class="v-thumb">
                        <span class="badge">${item.tag}</span>
                        <img src="${item.thumb}">
                    </div>
                    <div class="v-info" style="padding:10px;">
                        <h3 class="bn-text">${item.title}</h3>
                        <p style="font-size:10px; color:var(--text-dim); margin-bottom: 8px;">Views: ${item.views || 0}</p>
                        <button class="${btnClass}" id="b-${id}" onclick="initAction('${id}', '${category}', '${item.contentLink}', ${item.adsCount})">${btnText}</button>
                        <div class="btn-share" onclick="shareNow('${item.title}', '${id}', '${category}')">
                            <i class="fa-solid fa-share-nodes"></i> Share Link
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function shareNow(title, id, cat) {
            const url = window.location.origin + window.location.pathname + `?id=${id}&cat=${cat}`;
            if (navigator.share) {
                navigator.share({ title: title, url: url }).catch(err => console.log(err));
            } else {
                alert("লিঙ্ক কপি করা হয়েছে!");
            }
        }

        function initAction(id, type, link, ads) {
            // ইমেজ হলে সরাসরি ডাউনলোড লিংক
            if(type === 'image') {
                window.open(link, '_blank');
                db.ref('contents/' + id + '/views').transaction(v => (v || 0) + 1);
                return;
            }

            const directLink = "https://otieu.com/4/10346483"; 
            let storedClicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;
            
            if (storedClicks < (ads - 1)) {
                if (typeof show_10346520 === 'function') {
                    show_10346520().then(() => { handleProcess(id, ads, type); });
                } else { handleProcess(id, ads, type); }
            } else if (storedClicks === (ads - 1)) {
                handleProcess(id, ads, type);
                setTimeout(() => { window.location.href = directLink; }, 500);
            } else {
                db.ref('contents/' + id + '/views').transaction(v => (v || 0) + 1);
                window.location.href = link; 
            }
        }

        function handleProcess(id, ads, type) {
            let clicks = (parseInt(localStorage.getItem('clicks_' + id)) || 0) + 1;
            localStorage.setItem('clicks_' + id, clicks);
            updateBtnState(id, ads, type);
        }

        function updateBtnState(id, ads, type) {
            const btn = document.getElementById(`b-${id}`);
            if(!btn || type === 'image') return;
            let clicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;
            let rem = ads - clicks;
            if(rem > 0) {
                btn.innerText = `Unlock ${rem} Ads`;
            } else {
                btn.innerText = "Play Video";
                btn.classList.add('ready');
            }
        }

        function searchContent() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('v-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }

        loadData('video');
    </script>
</body>
</html>
