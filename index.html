    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        :root {   
            --bg: #060214;   
            --card-bg: rgba(15, 10, 31, 0.75);   
            --accent: linear-gradient(135deg, #7c3aed, #db2777);   
            --text-main: #f3f4f6;   
            --text-dim: #a1a1aa;   
            --input-bg: rgba(24, 18, 46, 0.8);  
            --play-btn: linear-gradient(135deg, #059669, #10b981);  
            --download-btn: linear-gradient(135deg, #2563eb, #3b82f6);  
            --tg-color: #24A1DE;
            --glass-border: rgba(124, 58, 237, 0.2);
            --banner-glow: cubic-bezier(0.4, 0, 0.2, 1) 0px 4px 20px rgba(124, 58, 237, 0.3);
            
            /* থাম্বনেইলের অতি গাঢ় বর্ডার কালার (Pure Neon Solid) */
            --thumb-border: #ff007f;
        }  

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }  
        
        /* ফন্ট কনফিগারেশন */
        body, input, button, p, span { 
            font-family: 'BUILT TITLING BD', 'Segoe UI', Roboto, sans-serif; 
        }
        .bn-text, #searchInput, .community-text span {
            font-family: 'Li Ador Noirrit Bold', sans-serif;
        }

        body { background-color: var(--bg); color: var(--text-main); background-image: radial-gradient(circle at 50% 0%, #251254 0%, var(--bg) 80%); background-attachment: fixed; }  

        /* Header UI */
        .sticky-top-container { position: sticky; top: 0; z-index: 1000; background: rgba(6, 2, 20, 0.88); backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }  
        .banner-header { width: 100%; height: auto; display: block; border-bottom: 1px solid rgba(124, 58, 237, 0.2); }  
          
        /* Premium Telegram Bar */
        .social-bar { 
            background: rgba(124, 58, 237, 0.05);
            backdrop-filter: blur(10px);
            margin: 14px 15px 8px 15px; 
            padding: 12px 18px; 
            border-radius: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(36, 161, 222, 0.4); 
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.15);
        }  
        .community-text { font-size: 14px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px; }  
        .community-text i { color: var(--tg-color); font-size: 20px; animation: float 3s ease-in-out infinite; }  
        .tg-join-btn { 
            background: linear-gradient(135deg, #24a1de, #0088cc); 
            color: white; 
            text-decoration: none; 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(36, 161, 222, 0.4);
            animation: pulse 2s infinite;
            transition: 0.3s;
        }  
        .tg-join-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(36, 161, 222, 0.7); }

        /* Modern Search Input */
        .search-container { padding: 10px 15px; max-width: 600px; margin: 0 auto; }  
        .search-box input { 
            width: 100%; 
            padding: 14px 22px; 
            border-radius: 50px; 
            border: 1px solid var(--glass-border); 
            background: var(--input-bg); 
            color: white; 
            outline: none; 
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }  
        .search-box input:focus { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }

        /* Layout & Content Sections */
        .content-section { display: none; padding: 10px 15px 120px 15px; max-width: 600px; margin: 0 auto; }  
        .content-section.active { display: block; animation: fadeIn 0.5s ease; }  

        /* Trending Section Layer */
        .trending-layer {
            margin-bottom: 22px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(219, 39, 119, 0.05));
            border: 1px solid rgba(219, 39, 119, 0.25);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .trending-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .trending-title i { color: #f59e0b; animation: pulse 1.5s infinite; }
        .trending-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-behavior: smooth; }
        .trending-scroll::-webkit-scrollbar { height: 4px; }
        .trending-scroll::-webkit-scrollbar-thumb { background: rgba(124, 58, 237, 0.4); border-radius: 10px; }
        
        /* Trending Item Thumbnail Side Shadow */
        .t-item { min-width: 130px; width: 130px; background: rgba(6, 2, 20, 0.6); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .t-item:hover { transform: translateY(-3px); border-color: #7c3aed; }
        .t-thumb { width: 100%; aspect-ratio: 16/9; position: relative; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .shorts-trend .t-thumb { aspect-ratio: 9/16; }
        .t-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .t-info { padding: 6px 8px; }
        .t-text { font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .t-views { font-size: 9px; color: #f59e0b; margin-top: 2px; font-weight: bold; }

        /* Premium Grid Design */  
        .grid-container {  
            display: grid;  
            grid-template-columns: 1fr 1fr;  
            gap: 16px;  
            align-items: start;  
        }  

        /* Glassmorphism Cards */
        .v-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid rgba(124, 58, 237, 0.15); 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s; 
            scroll-margin-top: 150px;
        }  
        .v-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 28px rgba(124, 58, 237, 0.25);
            border-color: rgba(219, 39, 119, 0.3);
        }
          
        /* Premium Thumbnail - ULTRA DEEP & SOLID NEON GLOW SHADOW */
        .v-thumb { 
            width: calc(100% - 16px);  
            aspect-ratio: 16/9; 
            position: relative; 
            background: #000; 
            overflow: hidden; 
            margin: 10px auto 2px auto; 
            border-radius: 14px; 
            
            /* ৩ পিক্সেল চওড়া সম্পূর্ণ সলিড নিয়ন ম্যাজেন্টা বর্ডার */
            border: 3px solid var(--thumb-border);
            
            /* মাল্টি-লেয়ার ঘন ও সর্বোচ্চ ব্রাইট গ্লো ইফেক্ট (Full Color Depth) */
            box-shadow: 
                0 0 8px 1px #ff007f, 
                0 0 20px 3px rgba(255, 0, 127, 0.95), 
                0 0 35px 6px rgba(124, 58, 237, 0.8);
            
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }  
        .shorts-card .v-thumb { aspect-ratio: 9/16; }  
        .image-card .v-thumb { aspect-ratio: auto; }  
          
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }  
        
        /* কার্ড হোভার বা টাচ করলে বর্ডার ও গ্লো এক্সট্রিম লেভেলে ব্লাস্ট করবে */
        .v-card:hover .v-thumb { 
            border-color: #00ffff; /* হোভার করলে নিয়ন সায়ান ব্লু বর্ডার */
            box-shadow: 
                0 0 10px 2px #00ffff, 
                0 0 25px 6px rgba(0, 255, 255, 0.95), 
                0 0 45px 10px rgba(255, 0, 127, 0.9);
        }
        .v-card:hover .v-thumb img { transform: scale(1.06); }
        .image-card .v-thumb img { object-fit: contain; background: #000; }  

        /* Badges */
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: white; padding: 5px 10px; border-radius: 30px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }  
          
        /* Typography */
        .bn-text { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; color: #fff; }  
          
        /* Action Buttons */
        .btn-main { 
            width: 100%; 
            padding: 11px; 
            border: none; 
            border-radius: 12px; 
            background: var(--accent); 
            color: white; 
            font-weight: 700; 
            cursor: pointer; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            font-size: 11px; 
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
        }  
        .btn-main:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 6px 16px rgba(219, 39, 119, 0.5); }
        .btn-main.ready { background: var(--play-btn); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }  
        .btn-main.ready:hover { box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5); }
        .btn-main.download { background: var(--download-btn); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }  
        .btn-main.download:hover { box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5); }  
          
        /* Premium Colored Share Button Matching Banner Theme */
        .btn-share { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #7c3aed; 
            border-radius: 12px; 
            background: rgba(124, 58, 237, 0.12); 
            color: #c084fc; 
            font-size: 11px; 
            font-weight: 600;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.1);
        }  
        .btn-share:hover { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4); }

        /* Premium Floating Navigation UI */
        .nav-wrapper { 
            position: fixed; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: rgba(15, 10, 31, 0.82); 
            backdrop-filter: blur(20px); 
            border-radius: 30px; 
            border: 1px solid rgba(124, 58, 237, 0.2); 
            z-index: 1000; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }  
        .bottom-nav { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px; }  
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); cursor: pointer; font-size: 11px; font-weight: 500; gap: 4px; padding: 8px 0; transition: all 0.3s; }  
        .nav-item i { font-size: 18px; transition: transform 0.3s; }
        .nav-item.active { color: #fff; }  
        .nav-item.active i { transform: translateY(-4px); color: #db2777; text-shadow: 0 0 12px rgba(219, 39, 119, 0.8); }

        /* Animations */  
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* Hide header configuration */  
        .hide-header .banner-header, .hide-header .social-bar { display: none; }  
    </style>
</head>

<!-- Floating Nav Menu -->
<div class="nav-wrapper">

        <div class="nav-item active" data-cat="video" onclick="tab('video', this)"><i class="fa-solid fa-bolt"></i><span>Video</span></div>

<script>  
    const firebaseConfig = {  
        apiKey: "AIzaSyByCC_vYgY_vA92s6OHDbKhbkTqnycYb5Q",  
        authDomain: "stream-vibe-b4900.firebaseapp.com",  
        databaseURL: "https://stream-vibe-b4900-default-rtdb.firebaseio.com",  
        projectId: "stream-vibe-b4900",  
        storageBucket: "stream-vibe-b4900.firebasestorage.app",  
        messagingSenderId: "997470087286",  
        appId: "1:997470087286:web:3ba3facca244c2c6651757"  
    };  
    firebase.initializeApp(firebaseConfig);  
    const db = firebase.database();  

    // Firebase fetching for Telegram Link
    db.ref('socialLinks').on('value', snap => {  
        const l = snap.val();  
        if(l){  
            document.getElementById('tg-link').href = l.tg || "#";  
        }  
    });  

    function tab(id, el) {  
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));  
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));  
        document.getElementById(id).classList.add('active');  
        if(el) el.classList.add('active');  
          
        const body = document.getElementById('main-body');  
        if(id === 'image' || id === 'short-film') {  
            body.classList.add('hide-header');  
        } else {  
            body.classList.remove('hide-header');  
        }  
        loadData(id);  
    }  

    // Smart View Formatter (1K, 2K, etc.)
    function formatViews(num) {
        if (!num || isNaN(num)) return '0';
        if (num >= 1000) {
            return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        }
        return num;
    }

    // Scroll to Specific Target Card Element smoothly
    function scrollToCard(cardId) {
        const element = document.getElementById(`card-${cardId}`);
        if(element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Add a temporary highlight effect
            element.style.borderColor = "#ff007f";
            setTimeout(() => { element.style.borderColor = "rgba(124, 58, 237, 0.15)"; }, 2000);
        }
    }

    function loadData(category) {  
        db.ref('contents').orderByChild('category').equalTo(category).on('value', snapshot => {  
            const list = document.getElementById(`${category}-list`);  
            let items = [];  
            snapshot.forEach(child => { items.push({ id: child.key, ...child.val() }); });  
            
            let reversedData = [...items].reverse();
            renderUI(reversedData, list, category);  
            renderTrending(items, category);
        });  
    }  

    // Render Auto Filtered Trending Slider Layer
    function renderTrending(data, category) {
        const trendLayer = document.getElementById(`${category}-trend-layer`);
        const trendList = document.getElementById(`${category}-trending-list`);
        if(!trendLayer || !trendList) return;

        // Filter contents that have views > 0 and sort by highest views
        let popularItems = data.filter(item => (item.views || 0) > 0)
                              .sort((a, b) => (b.views || 0) - (a.views || 0))
                              .slice(0, 5); // Pick top 5 trending items

        if(popularItems.length > 0) {
            trendLayer.style.display = "block";
            let trendHtml = '';
            popularItems.forEach(item => {
                trendHtml += `
                <div class="t-item" onclick="scrollToCard('${item.id}')">
                    <div class="t-thumb" style="border: 1px solid var(--thumb-border); box-shadow: 0 0 8px rgba(255,0,127,0.6);">
                        <img src="${item.thumb}">
                    </div>
                    <div class="t-info">
                        <div class="t-text">${item.title}</div>
                        <div class="t-views"><i class="fa-solid fa-eye"></i> ${formatViews(item.views)}</div>
                    </div>
                </div>`;
            });
            trendList.innerHTML = trendHtml;
        } else {
            trendLayer.style.display = "none";
        }
    }

    function renderUI(data, container, category) {  
        let html = '';  
        data.forEach(item => {  
            const id = item.id;  
            let cardClass = "v-card";  
            if(category === 'short-film') cardClass += " shorts-card";  
            if(category === 'image') cardClass += " image-card";  
              
            let btnText = "";  
            let btnClass = "btn-main";  
              
            if(category === 'image') {  
                btnText = "Download";  
                btnClass = "btn-main download";  
            } else {  
                let storedClicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;  
                let isReady = storedClicks >= item.adsCount;  
                btnText = isReady ? "Play Video" : `Unlock ${item.adsCount - storedClicks} Ads`;  
                btnClass = isReady ? "btn-main ready" : "btn-main";  
            }  

            html += `  
            <div class="${cardClass}" id="card-${id}" data-title="${item.title.toLowerCase()}">  
                <div class="v-thumb">  
                    <span class="badge">${item.tag}</span>  
                    <img src="${item.thumb}">  
                </div>  
                <div class="v-info" style="padding:12px;">  
                    <h3 class="bn-text">${item.title}</h3>  
                    <p style="font-size:10px; color:var(--text-dim); margin-bottom: 10px; display:flex; align-items:center; gap:4px;">
                        <i class="fa-solid fa-eye" style="color:#7c3aed;"></i> Views: ${formatViews(item.views || 0)}
                    </p>  
                    <button class="${btnClass}" id="b-${id}" onclick="initAction('${id}', '${category}', '${item.contentLink}', ${item.adsCount})">${btnText}</button>  
                    <div class="btn-share" onclick="shareNow('${item.title}', '${id}', '${category}')">  
                        <i class="fa-solid fa-share-nodes"></i> Share Link  
                    </div>  
                </div>  
            </div>`;  
        });  
        container.innerHTML = html;  
    }  

    function shareNow(title, id, cat) {  
        const url = window.location.origin + window.location.pathname + `?id=${id}&cat=${cat}`;  
        if (navigator.share) {  
            navigator.share({ title: title, url: url }).catch(err => console.log(err));  
        } else {  
            navigator.clipboard.writeText(url).then(() => {
                alert("লিঙ্ক কপি করা হয়েছে!");  
            });
        }  
    }  

    function initAction(id, type, link, ads) {  
        if(type === 'image') {  
            window.open(link, '_blank');  
            db.ref('contents/' + id + '/views').transaction(v => (v || 0) + 1);  
            return;  
        }  

        const directLink = "https://otieu.com/4/10346483";   
        let storedClicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;  
          
        if (storedClicks < (ads - 1)) {  
            if (typeof show_10346520 === 'function') {  
                show_10346520().then(() => { handleProcess(id, ads, type); });  
            } else { handleProcess(id, ads, type); }  
        } else if (storedClicks === (ads - 1)) {  
            handleProcess(id, ads, type);  
            setTimeout(() => { window.location.href = directLink; }, 500);  
        } else {  
            db.ref('contents/' + id + '/views').transaction(v => (v || 0) + 1);  
            window.location.href = link;   
        }  
    }  

    function handleProcess(id, ads, type) {  
        let clicks = (parseInt(localStorage.getItem('clicks_' + id)) || 0) + 1;  
        localStorage.setItem('clicks_' + id, clicks);  
        updateBtnState(id, ads, type);  
    }  

    function updateBtnState(id, ads, type) {  
        const btn = document.getElementById(`b-${id}`);  
        if(!btn || type === 'image') return;  
        let clicks = parseInt(localStorage.getItem('clicks_' + id)) || 0;  
        let rem = ads - clicks;  
        if(rem > 0) {  
            btn.innerText = `Unlock ${rem} Ads`;  
        } else {  
            btn.innerText = "Play Video";  
            btn.classList.add('ready');  
        }  
    }  

    function searchContent() {  
        let input = document.getElementById('searchInput').value.toLowerCase();  
        let cards = document.getElementsByClassName('v-card');  
        for (let i = 0; i < cards.length; i++) {  
            let title = cards[i].getAttribute('data-title');  
            cards[i].style.display = title.includes(input) ? "block" : "none";  
        }  
    }  

    loadData('video');  
</script>  
</body>  
    </html>
